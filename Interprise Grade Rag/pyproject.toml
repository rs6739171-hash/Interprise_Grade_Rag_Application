[project]
name = "interprise-grade-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deepeval>=4.1.8",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "google-generativeai>=0.8.6",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.3",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.4.3",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "langsmith>=0.10.18",
    "logfire[fastapi,requests]>=4.40.0",
    "loguru>=0.7.3",
    "nemoguardrails>=0.23.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.5.2",
    "openai>=2.54.0",
    "pdfplumber>=0.11.10",
    "portkey-ai>=2.3.4",
    "pydantic>=2.0.0",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0.2",
    "pytz>=2026.3.post1",
    "qdrant-client>=1.19.0",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "sentence-transformers>=2.2.2",
    "simpleeval>=1.0.7",
    "streamlit>=1.61.1",
    "typing-inspect>=0.9.0",
    "unstructured>=0.25.2",
    "uvicorn[standard]>=0.52.2",
]

[project.scripts]
interprise-grade-rag = "interprise_grade_rag:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["."]

